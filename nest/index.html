<!doctype html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fize — Vitrine</title>
<!-- Écran vitrine pour le Google Nest Hub (1re gén., 1024 × 600, processeur lent) :
     on n'anime que transform et opacity, une seule diapositive vit à la fois. -->
<style>
@font-face { font-family: "VG5000"; src: url(fonts/VG5000-Regular_web.woff2) format("woff2"); font-display: block; }

:root {
  --bg: #0e0e0d; --ink: #f2f2ee; --text: #c4c4bf; --mute: #8f8f8a; --faint: #4a4a47; --line: #262624;
  --u: min(1vw, 1.7067vh);            /* 1 % de la largeur d'un écran 1024 × 600, quelle que soit la taille */
  --duree: 8s;                         /* temps d'une diapositive (repris par le script) */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none; cursor: none; }
body.souris { cursor: default; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

.vg { font-family: "VG5000", "Helvetica Neue", sans-serif; text-transform: uppercase; font-weight: normal; }
.lbl { font-size: calc(var(--u) * 1.15); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.mono { font-family: Menlo, "DejaVu Sans Mono", monospace; }

/* ── bandeau haut ── */
.haut { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: calc(var(--u) * 1.4);
  padding: calc(var(--u) * 2.4) calc(var(--u) * 3.2) 0; }
.haut img { height: calc(var(--u) * 3.6); transition: opacity .8s ease .3s, transform .9s cubic-bezier(.16,1,.3,1) .3s; }
.ouvre .haut img { opacity: 0; transform: translateY(calc(var(--u) * -1.2)); transition: opacity .4s ease, transform .4s ease; }
.haut .nom { font-size: calc(var(--u) * 2); letter-spacing: .02em; }
.haut .vide { flex: 1; }
.haut .heure { font-size: calc(var(--u) * 1.6); color: var(--mute); }

/* ── scène ── */
.scene { position: fixed; inset: 0; }
.diapo { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s .7s; }
.diapo.on { opacity: 1; visibility: visible; transition: opacity .7s ease .15s, visibility 0s; }

/* halo coloré derrière la pièce : la couleur vient du projet, jamais de la marque */
.halo { position: absolute; left: 0; top: 14%; width: 34%; height: 72%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--c, #555) 0%, transparent 100%); opacity: .28; }

/* la pièce : elle monte en entrant, puis lévite */
.piece { position: absolute; left: 6%; top: 24%; width: 22%; height: 52%; display: flex; align-items: center; justify-content: center;
  transform: translateY(6%); opacity: 0; transition: transform 1s cubic-bezier(.2,.7,.2,1) .25s, opacity .8s ease .25s; }
.on .piece { transform: none; opacity: 1; }
.piece .flotte { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
.on .piece .flotte { animation: leviter 4.2s ease-in-out infinite alternate; }
.piece img { max-width: 100%; max-height: 100%; }
.ombre { position: absolute; left: 10%; bottom: 19%; width: 14%; height: calc(var(--u) * 1.6); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0,0,0,.75), transparent); }
.on .ombre { animation: ombre 4.2s ease-in-out infinite alternate; }
@keyframes leviter { from { transform: translateY(1.5%); } to { transform: translateY(-2.5%); } }
@keyframes ombre   { from { transform: scaleX(1); opacity: .9; } to { transform: scaleX(.8); opacity: .5; } }

.sans-photo .halo { left: 6%; width: 52%; }
.sans-photo .piece { left: 8%; width: 48%; top: 13%; height: 72%; }
.sans-photo .ombre { left: 22%; }
.sans-photo .info { left: 58%; }

/* la photo réelle : elle glisse en place une fois la pièce posée, puis ne bouge plus */
.photo { position: absolute; left: 30%; top: 50%; width: 31%; margin-top: calc(var(--u) * -20.6);
  opacity: 0; transform: translateX(calc(var(--u) * 3)); transition: opacity .7s ease 1.2s, transform .9s cubic-bezier(.2,.7,.2,1) 1.2s; }
.on .photo { opacity: 1; transform: none; }
.photo img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: calc(var(--u) * .4); }
.photo .lbl { margin-top: calc(var(--u) * 1); font-size: calc(var(--u) * 1); }

/* le texte à droite */
.info { position: absolute; left: 64.5%; right: 8%; top: 50%; transform: translateY(-50%); }
.info .lbl { margin-bottom: calc(var(--u) * 1.2); }
.info h2 { font-size: calc(var(--u) * 4.8); line-height: .98; letter-spacing: -.01em; position: relative; }
.info .fini { margin-top: calc(var(--u) * 2.2); font-size: calc(var(--u) * 1.75); color: var(--text); line-height: 1.4;
  opacity: 0; transform: translateY(calc(var(--u) * 1.2)); }
.on .info .fini { transition: opacity .9s ease .85s, transform 1.1s cubic-bezier(.16,1,.3,1) .85s; }
.on .info .fini { opacity: 1; transform: none; }

/* le texte arrive en douceur, en cascade : catégorie, titre, finition */
.info .lbl, .imprime > span { opacity: 0; transform: translateY(calc(var(--u) * 1.6)); }
.on .info .lbl { opacity: 1; transform: none; transition: opacity .8s ease .45s, transform 1s cubic-bezier(.16,1,.3,1) .45s; }
.imprime { display: block; overflow: hidden; padding-bottom: .06em; }
.imprime > span { display: block; transform: translateY(70%); }
.on .imprime > span { opacity: 1; transform: none; transition: opacity .9s ease .6s, transform 1.2s cubic-bezier(.16,1,.3,1) .6s; }

/* ── ouverture : le logo chrome ── */
.ouverture { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ouverture .logo { width: calc(var(--u) * 46); transform: scale(.92); opacity: 0; transition: transform 1.2s cubic-bezier(.2,.7,.2,1), opacity 1s ease; }
.ouverture.on .logo { transform: none; opacity: 1; }
.ouverture.on .logo img { animation: leviter 4.2s ease-in-out infinite alternate; }
.ouverture .logo img { width: 100%; display: block; }
.ouverture .mot { margin-top: calc(var(--u) * 3.4); height: calc(var(--u) * 2); overflow: hidden; }
.ouverture .mot span { display: block; transition: transform .45s ease, opacity .45s ease; }
.ouverture .mot span.sort { transform: translateY(-100%); opacity: 0; }
.ouverture .mot span.entre { transform: translateY(100%); opacity: 0; transition: none; }


.qr svg { display: block; width: 100%; height: auto; }

/* ── commandes ── */
.fleche { position: fixed; top: 50%; z-index: 6; width: calc(var(--u) * 5.4); height: calc(var(--u) * 5.4); margin-top: calc(var(--u) * -2.7);
  border: 1px solid var(--faint); border-radius: 50%; display: grid; place-items: center; opacity: .55; transition: opacity .3s, transform .2s; }
.fleche:active { transform: scale(.9); opacity: 1; }
.fleche svg { width: 38%; }
.fleche.g { left: calc(var(--u) * 1.6); } .fleche.d { right: calc(var(--u) * 1.6); }

.bas { position: fixed; left: calc(var(--u) * 3.2); right: calc(var(--u) * 3.2); bottom: calc(var(--u) * 2.6); z-index: 6;
  display: flex; align-items: center; gap: calc(var(--u) * 2); }
.points { display: flex; gap: calc(var(--u) * .8); flex: 1; }
.points i { display: block; flex: 0 0 calc(var(--u) * 4); height: 2px; background: var(--line); position: relative; overflow: hidden; }
.points i b { position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; }
.points i.vu b { transform: scaleX(1); }
.points i.cours b { animation: avance var(--duree) linear forwards; }
.pause .points i.cours b { animation-play-state: paused; }
@keyframes avance { to { transform: scaleX(1); } }

.reseau { display: flex; align-items: center; gap: calc(var(--u) * .8); padding: calc(var(--u) * .9) calc(var(--u) * 1.6);
  border: 1px solid var(--faint); border-radius: 999px; font-size: calc(var(--u) * 1.15); letter-spacing: .16em; text-transform: uppercase; }
.reseau svg { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); }
.reseau.plein { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.reseau:active { transform: scale(.95); }

/* ── panneau QR : il arrive de la droite et repart ── */
.voile { position: fixed; inset: 0; z-index: 7; background: rgba(0,0,0,.55); opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
.panneau { position: fixed; top: 0; right: 0; bottom: 0; width: 46%; z-index: 8; background: #0b0b0b; border-left: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--u) * 3);
  transform: translateX(101%); transition: transform .55s cubic-bezier(.2,.7,.2,1); }
.qr-ouvert .voile { opacity: 1; visibility: visible; transition: opacity .4s, visibility 0s; }
.qr-ouvert .panneau { transform: none; }
.onglets { display: flex; gap: calc(var(--u) * .6); margin-bottom: calc(var(--u) * 3); }
.onglets button { padding: calc(var(--u) * .8) calc(var(--u) * 1.3); border-radius: 999px; border: 1px solid var(--faint);
  font-size: calc(var(--u) * 1.1); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.onglets button.actif { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.panneau .qr { width: calc(var(--u) * 25); padding: calc(var(--u) * 1.8); background: #fff; border-radius: calc(var(--u) * .8);
  transition: opacity .25s, transform .25s; }
.panneau .qr.change { opacity: 0; transform: scale(.96); }
.panneau .titre { margin-top: calc(var(--u) * 2.4); font-size: calc(var(--u) * 2.6); }
.panneau .detail { margin-top: calc(var(--u) * .8); font-size: calc(var(--u) * 1.5); color: var(--mute); text-align: center; }
.fermer { position: absolute; top: calc(var(--u) * 2); right: calc(var(--u) * 2); width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4);
  border: 1px solid var(--faint); border-radius: 50%; display: grid; place-items: center; }
.fermer svg { width: 36%; }
</style>
</head>
<body class="ouvre">

<header class="haut">
  <img src="img/F-LAB_centre_sans-cadre_blanc.svg" alt="F-LAB">
  <span class="vide"></span>
  <span class="heure mono" id="heure"></span>
</header>

<main class="scene" id="scene"></main>

<button class="fleche g" id="prec" aria-label="Précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 4 7 12l8 8"/></svg></button>
<button class="fleche d" id="suiv" aria-label="Suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 4 8 8-8 8"/></svg></button>

<footer class="bas">
  <div class="points" id="points"></div>
  <button class="reseau" data-qr="instagram" aria-label="Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".9" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="reseau plein" data-qr="site">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg>
    Scanner
  </button>
</footer>

<div class="voile" id="voile"></div>
<aside class="panneau" id="panneau" aria-hidden="true">
  <button class="fermer" id="fermer" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
  <div class="onglets" id="onglets"></div>
  <div class="qr" id="qr-grand"></div>
  <div class="titre vg" id="qr-titre"></div>
  <div class="detail" id="qr-detail"></div>
</aside>

<script src="qr.js"></script>
<script>
(function () {
  'use strict';

  // ── Contenu : les pièces du site (rendus détourés de site-portfolio-v3), sans noms de clients ──
  var PIECES = [
    { img: 'buste',          titre: 'Buste bronze',   cat: 'Accessoire de tournage', fini: 'PLA mat, finition bronze',                  c: '#8c5e2e', photo: 1 },
    { img: 'justice',        titre: 'Justice',        cat: 'Décor',                  fini: "Blanc veiné d'or, peint à la main",       c: '#b8913b', photo: 1 },
    { img: 'micro',          titre: 'Micro serti',    cat: 'Accessoire de scène',    fini: 'Base noire, sertie de strass',              c: '#8e949b', photo: 1 },
    { img: 'bijoux',         titre: 'Bijoux',         cat: 'Accessoire de scène',    fini: 'Effet métal argenté',                       c: '#a7adb4', photo: 1 },
    { img: 'guitare-chicha', titre: 'Guitare chicha', cat: 'Décor',                  fini: 'Blocs décalés, assemblés sur socle',        c: '#9a6b4a' },
    { img: 'plaque-logo',    titre: 'Plaque logo',    cat: 'Objet de marque',        fini: 'Trois couleurs, sans peinture',             c: '#6f7f99', photo: 1 },
    { img: 'kit-rose',       titre: 'Kit rose',       cat: 'Accessoire de tournage', fini: 'Série de pièces pour une vidéo YouTube',    c: '#c97a98', photo: 1 },
    { img: 'rpi-case',       titre: 'Boitier Pi',     cat: 'Projet perso',           fini: 'Résine transparente, carte visible',        c: '#1f8a3c' }
  ];
  // (sans accents dans les titres : en VG5000 capitales, les lettres accentuées passent mal)

  var MOTS = ['Laboratoire creatif', 'Accessoiriste', 'Decors & accessoires', 'Objets de marque', 'Prototypage', 'Atelier de finition'];

  var QR_INFOS = {
    site:      { onglet: 'Site',      titre: 'Le site',      detail: 'impression3dbyfize.framer.website' },
    contact:   { onglet: 'Contact',   titre: 'Mon contact',  detail: 'Tom Fize — 09 83 62 84 04<br>Ajouté directement à vos contacts' },
    instagram: { onglet: 'Instagram', titre: 'Instagram',    detail: '@3dprint_by_fize' },
    tiktok:    { onglet: 'TikTok',    titre: 'TikTok',       detail: '@3dprint.by.fize' }
  };
  var ORDRE_QR = ['site', 'contact', 'instagram', 'tiktok'];

  var V = '5';             // à augmenter quand une image change : le Nest garde les anciennes en mémoire
  var DUREE = 8000;          // une diapositive
  var QR_AUTO_FERME = 30000; // le panneau QR se referme seul

  function $(id) { return document.getElementById(id); }
  function svgQR(cle) {
    var q = window.QR[cle];
    return '<svg viewBox="0 0 ' + q.n + ' ' + q.n + '" shape-rendering="crispEdges"><path fill="#000" d="' + q.d + '"/></svg>';
  }

  // ── Construction des diapositives ──
  var html = '<section class="diapo ouverture">' +
      '<div class="logo"><img src="img/F-LAB_centre_cadre_blanc.svg" alt="F-LAB"></div>' +
      '<div class="mot lbl"><span id="mot">' + MOTS[0] + '</span></div></section>';
  PIECES.forEach(function (p, i) {
    html += '<section class="diapo' + (p.photo ? '' : ' sans-photo') + '" style="--c:' + p.c + '">' +
      '<div class="halo"></div><div class="ombre"></div>' +
      '<div class="piece"><div class="flotte"><img src="img/' + p.img + '.png?v=' + V + '" alt=""></div></div>' +
      (p.photo ? '<figure class="photo"><img src="img/photo-' + p.img + '.jpg?v=' + V + '" alt=""><div class="lbl">En vrai</div></figure>' : '') +
      '<div class="info">' +
        '<div class="lbl">' + p.cat + '</div>' +
        '<h2 class="vg imprime"><span>' + p.titre + '</span></h2>' +
        '<p class="fini">' + p.fini + '</p>' +
      '</div></section>';
  });
  $('scene').innerHTML = html;

  var diapos = document.querySelectorAll('.diapo');
  var n = diapos.length;
  $('points').innerHTML = new Array(n + 1).join('<i><b></b></i>');
  var points = $('points').children;

  // ── Défilement ──
  var cur = -1, minuteur = null, debut = 0, reste = DUREE, enPause = false;

  function montrer(i) {
    i = (i + n) % n;
    if (cur >= 0) diapos[cur].classList.remove('on');
    diapos[i].classList.add('on');
    document.body.classList.toggle('ouvre', i === 0);
    for (var k = 0; k < n; k++) {
      points[k].className = k < i ? 'vu' : '';
      var b = points[k].firstChild; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    }
    points[i].className = 'cours';
    cur = i;
    reste = DUREE;
    programmer();
  }
  function programmer() {
    clearTimeout(minuteur);
    if (enPause) return;
    debut = Date.now();
    minuteur = setTimeout(function () { montrer(cur + 1); }, reste);
  }
  function pause(oui) {
    if (oui === enPause) return;
    enPause = oui;
    document.body.classList.toggle('pause', oui);
    if (oui) { clearTimeout(minuteur); reste = Math.max(0, reste - (Date.now() - debut)); }
    else programmer();
  }

  $('prec').onclick = function () { montrer(cur - 1); };
  $('suiv').onclick = function () { montrer(cur + 1); };

  // glisser du doigt sur l'écran
  var x0 = null;
  $('scene').addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  $('scene').addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) montrer(cur + (dx < 0 ? 1 : -1));
  });

  // ── Panneau QR ──
  var autoFerme = null;
  $('onglets').innerHTML = ORDRE_QR.map(function (k) { return '<button data-qr="' + k + '">' + QR_INFOS[k].onglet + '</button>'; }).join('');

  function choisirQR(cle) {
    var box = $('qr-grand');
    var remplir = function () {
      box.innerHTML = svgQR(cle);
      $('qr-titre').textContent = QR_INFOS[cle].titre;
      $('qr-detail').innerHTML = QR_INFOS[cle].detail;
      var b = $('onglets').children;
      for (var k = 0; k < b.length; k++) b[k].className = b[k].getAttribute('data-qr') === cle ? 'actif' : '';
      box.classList.remove('change');
    };
    if (box.innerHTML) { box.classList.add('change'); setTimeout(remplir, 200); } else remplir();
    clearTimeout(autoFerme);
    autoFerme = setTimeout(fermerQR, QR_AUTO_FERME);
  }
  function ouvrirQR(cle) {
    document.body.classList.add('qr-ouvert');
    $('panneau').setAttribute('aria-hidden', 'false');
    pause(true);
    choisirQR(cle || 'site');
  }
  function fermerQR() {
    clearTimeout(autoFerme);
    document.body.classList.remove('qr-ouvert');
    $('panneau').setAttribute('aria-hidden', 'true');
    pause(false);
  }
  function qrOuvert() { return document.body.classList.contains('qr-ouvert'); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-qr]') : null;
    if (!t) return;
    if (t.parentNode.id === 'onglets') choisirQR(t.getAttribute('data-qr'));
    else ouvrirQR(t.getAttribute('data-qr'));
  });
  $('fermer').onclick = fermerQR;
  $('voile').onclick = fermerQR;

  // clavier / télécommande
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight') montrer(cur + 1);
    else if (k === 'ArrowLeft') montrer(cur - 1);
    else if (k === 'q' || k === 'Enter' || k === ' ') qrOuvert() ? fermerQR() : ouvrirQR('site');
    else if (k === 'Escape' || k === 'Backspace') fermerQR();
  });

  // le curseur n'apparaît que si une souris bouge (aperçu sur ordinateur)
  var cache = null;
  document.addEventListener('mousemove', function () {
    document.body.classList.add('souris'); clearTimeout(cache);
    cache = setTimeout(function () { document.body.classList.remove('souris'); }, 2500);
  });

  // ── La ligne sous le logo change toutes les 2,6 s ──
  var m = 0, mot = $('mot');
  setInterval(function () {
    if (cur !== 0) return;
    mot.className = 'sort';
    setTimeout(function () {
      m = (m + 1) % MOTS.length; mot.textContent = MOTS[m];
      mot.className = 'entre'; void mot.offsetWidth; mot.className = '';
    }, 450);
  }, 2600);

  // ── Heure ──
  function heure() { var d = new Date(); $('heure').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  heure(); setInterval(heure, 20000);

  // on attend la police pour que le premier titre « s'imprime » dans la bonne typo
  var go = function () { if (cur < 0) montrer(0); };
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(go); setTimeout(go, 1500); } else go();
})();
</script>
</body>
</html>
